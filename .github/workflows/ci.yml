name: CI

# Two runs share this workflow:
# - the push gate (push, pull_request): native builds, sanitizers, generator
#   determinism, the package consumer and the fast Python subset, about ten
#   minutes in all;
# - the full run (weekly schedule, workflow_dispatch): everything above plus
#   the full Python suite, the byte-exact corpus parity with the parameter
#   sweep, and the define-parameter enumeration in its own job.
# Export kit releases only after a successful full run on main.

on:
  push:
    paths-ignore:
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - '.github/FUNDING.yml'
      - '.github/CODEOWNERS'
      - '.editorconfig'
      - 'docs/*.md'
      - 'docs/plans/**'
      - 'docs/hero.jpg'
      - 'docs/port-engineering/README.md'
      - 'docs/port-engineering/task-*review*.md'
      - 'docs/port-engineering/task-*review*.md.sha256'
      - 'docs/port-engineering/task-*brief.md'
      - 'docs/port-engineering/task-*brief.md.sha256'
      - 'docs/port-engineering/task-*design*.md'
      - 'docs/port-engineering/task-*design*.md.sha256'
      - 'docs/port-engineering/shape-mixer-parity/README.md'
    branches: [main]
  pull_request:
    paths-ignore:
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - '.github/FUNDING.yml'
      - '.github/CODEOWNERS'
      - '.editorconfig'
      - 'docs/*.md'
      - 'docs/plans/**'
      - 'docs/hero.jpg'
      - 'docs/port-engineering/README.md'
      - 'docs/port-engineering/task-*review*.md'
      - 'docs/port-engineering/task-*review*.md.sha256'
      - 'docs/port-engineering/task-*brief.md'
      - 'docs/port-engineering/task-*brief.md.sha256'
      - 'docs/port-engineering/task-*design*.md'
      - 'docs/port-engineering/task-*design*.md.sha256'
      - 'docs/port-engineering/shape-mixer-parity/README.md'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

# The gate and the full run keep separate groups, so a push never cancels a
# full run in progress. A newer push still supersedes an older gate.
concurrency:
  group: ci-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'gate' }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  native:
    name: native ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Install zlib (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      # The project compiles with -Wall -Wextra -Wpedantic -Werror
      # -ffp-contract=off; any new warning fails the build here.
      - name: Build
        run: cmake --build build --target noisemaker-cpu-tests -j

      - name: Test
        run: |
          python3 tools/run_partitioned_checks.py native --executable "$PWD/build/noisemaker-cpu-tests"
          ctest --test-dir build --output-on-failure --exclude-regex '^noisemaker-cpu-tests$' --timeout 300

  sanitizers:
    name: sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zlib
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      # -O1 is the level the AddressSanitizer documentation recommends for
      # reasonable performance. At the Debug default of -O0, the heaviest
      # single test ran close to the partition runner's per-child bound.
      - name: Configure
        run: |
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-O1 -fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-sanitize --target noisemaker-cpu-tests -j

      # Linux supports LeakSanitizer, so leak detection stays on here.
      # (On Apple platforms detect_leaks is unsupported and must be disabled.)
      - name: Run
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: python3 tools/run_partitioned_checks.py native --executable "$PWD/build-sanitize/noisemaker-cpu-tests"

  generator:
    name: generator determinism / py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # These are --check (never --write): they regenerate the typed slice in
      # memory and fail if the committed outputs differ by a single byte, so
      # generation stays deterministic and the checked-in artifacts stay honest.
      - name: Validate pinned corpus
        run: python -m tools.glslcpp.check_corpus --check

      - name: Validate corpus semantics
        run: python -m tools.glslcpp.check_semantics --check

      - name: Verify generated typed slice is byte-identical
        run: python -m tools.glslcpp.generate_typed_slice --check

      - name: Verify generated kernels are byte-identical
        run: python -m tools.glslcpp.generate_kernels --check

  python-frozen-oracles:
    name: frozen oracle mutation words / macOS arm64
    # Frozen mutation witnesses retain architecture-specific NaN payloads.
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '26.0.0'

      - uses: actions/checkout@v4
        with:
          repository: noisefactorllc/noisemaker-for-cpu
          ref: db42f30c5c3ab711362bf5dbd4013b16637b48f5
          fetch-depth: 0
          path: cpu-fixtures-checkout
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: noisefactorllc/noisemaker
          ref: d0ed94ae19cca7328bc7d6b28902712a0838e1a9
          fetch-depth: 0
          path: shader-fixtures-checkout
          persist-credentials: false

      - name: Prepare authenticated oracle sources
        run: |
          mv "$GITHUB_WORKSPACE/cpu-fixtures-checkout" "$RUNNER_TEMP/cpu-fixtures-git"
          mv "$GITHUB_WORKSPACE/shader-fixtures-checkout" "$RUNNER_TEMP/shader-fixtures-git"
          python - <<'PY'
          import hashlib, io, os, pathlib, shutil, subprocess, tarfile
          temporary = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          cpu_git = temporary / 'cpu-fixtures-git'
          sources = {
              'cpu-authority': 'db42f30c5c3ab711362bf5dbd4013b16637b48f5',
              'cpu-frozen-9b729482': '9b7294820eec2a0b95c66790b1dae374fa079c13',
              'cpu-historical': '8b257b0f8651f46d090dd76663805735194f1f56',
              'cpu-dsl-render': '4834b0144ee0524588144a482cca0067b15f68ec',
          }
          for name, revision in sources.items():
              root = temporary / name
              root.mkdir()
              archive = subprocess.check_output(['git', '-C', str(cpu_git), 'archive', revision])
              with tarfile.open(fileobj=io.BytesIO(archive)) as bundle:
                  members = bundle.getmembers()
                  for member in members:
                      path = pathlib.PurePosixPath(member.name)
                      if (path.is_absolute() or '..' in path.parts
                              or not (member.isfile() or member.isdir())):
                          raise RuntimeError(f'Non-regular oracle archive member: {member.name}')
                  bundle.extractall(root, members=members, filter='data')
              ledger = temporary / f'{name}.sha256'
              ledger.write_text(''.join(
                  f'{hashlib.sha256(file.read_bytes()).hexdigest()}  {file}\n'
                  for file in sorted(root.rglob('*')) if file.is_file()))
          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          values = {
              'NOISEMAKER_CPU_ROOT': temporary / 'cpu-authority',
              'NOISEMAKER_CPU_AUTHORITY_LEDGER': temporary / 'cpu-authority.sha256',
              'NOISEMAKER_CPU_9B729482_ROOT': temporary / 'cpu-frozen-9b729482',
              'NOISEMAKER_CPU_9B729482_LEDGER': temporary / 'cpu-frozen-9b729482.sha256',
              'NOISEMAKER_HISTORICAL_CPU_ROOT': temporary / 'cpu-historical',
              'NOISEMAKER_DSL_RENDER_CPU_ROOT': temporary / 'cpu-dsl-render',
              'NOISEMAKER_DSL_RENDER_ORACLE_LEDGER': temporary / 'cpu-dsl-render.sha256',
              'NOISEMAKER_CHAIN_COPY_CPU_ROOT': temporary / 'cpu-frozen-9b729482',
              'NOISEMAKER_FOR_CPU': cpu_git,
              'NOISEMAKER_SHADER_GIT': temporary / 'shader-fixtures-git',
              'NOISEMAKER_ORACLE_NODE': pathlib.Path(shutil.which('node')).resolve(),
          }
          executables = {
              'NOISEMAKER_DSL_CPU_CASE': 'noisemaker-dsl-cpu-case',
              'NOISEMAKER_DSL_CPU_BENCHMARK': 'noisemaker-dsl-cpu-benchmark',
              'NOISEMAKER_RENDER_CLI': 'noisemaker-render',
              'NOISEMAKER_EXAMPLE_PERLIN': 'noisemaker-cpu-example-perlin',
              'NOISEMAKER_DSL_CPP_ORACLE': 'noisemaker-dsl-frontend-oracle',
              'NOISEMAKER_DSL_PARSER_ORACLE': 'noisemaker-dsl-parser-oracle',
              'NOISEMAKER_DSL_COMPILER_ORACLE': 'noisemaker-dsl-compiler-oracle',
          }
          values.update({key: workspace / 'build' / value for key, value in executables.items()})
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, value in values.items():
                  output.write(f'{key}={value}\n')
          PY

      - name: Verify frozen oracle execution platform
        run: |
          python -c 'import platform, sys; assert sys.platform == "darwin" and platform.machine() == "arm64"'
          node -e 'if (process.version !== "v26.0.0" || process.platform !== "darwin" || process.arch !== "arm64") process.exit(1)'

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run architecture-bound oracle checks
        run: python tools/run_partitioned_checks.py python --python-suite frozen-macos

  python-gate:
    name: python push-gate subset
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '26.0.0'

      - uses: actions/checkout@v4
        with:
          repository: noisefactorllc/noisemaker-for-cpu
          ref: db42f30c5c3ab711362bf5dbd4013b16637b48f5
          fetch-depth: 0
          path: cpu-fixtures-checkout
