              'cpu-dsl-render': '4834b0144ee0524588144a482cca0067b15f68ec',
          }
          for name, revision in sources.items():
              root = temporary / name
              root.mkdir()
              archive = subprocess.check_output(['git', '-C', str(cpu_git), 'archive', revision])
              with tarfile.open(fileobj=io.BytesIO(archive)) as bundle:
                  members = bundle.getmembers()
                  for member in members:
                      path = pathlib.PurePosixPath(member.name)
                      if (path.is_absolute() or '..' in path.parts
                              or not (member.isfile() or member.isdir())):
                          raise RuntimeError(f'Non-regular oracle archive member: {member.name}')
                  bundle.extractall(root, members=members, filter='data')
              ledger = temporary / f'{name}.sha256'
              ledger.write_text(''.join(
                  f'{hashlib.sha256(file.read_bytes()).hexdigest()}  {file}\n'
                  for file in sorted(root.rglob('*')) if file.is_file()))
          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          values = {
              'NOISEMAKER_REGEN_CACHE': temporary / 'typed-regen-cache',
              'NOISEMAKER_CPU_ROOT': temporary / 'cpu-authority',
              'NOISEMAKER_CPU_AUTHORITY_LEDGER': temporary / 'cpu-authority.sha256',
              'NOISEMAKER_CPU_9B729482_ROOT': temporary / 'cpu-frozen-9b729482',
              'NOISEMAKER_CPU_9B729482_LEDGER': temporary / 'cpu-frozen-9b729482.sha256',
              'NOISEMAKER_HISTORICAL_CPU_ROOT': temporary / 'cpu-historical',
              'NOISEMAKER_DSL_RENDER_CPU_ROOT': temporary / 'cpu-dsl-render',
              'NOISEMAKER_DSL_RENDER_ORACLE_LEDGER': temporary / 'cpu-dsl-render.sha256',
              'NOISEMAKER_CHAIN_COPY_CPU_ROOT': temporary / 'cpu-frozen-9b729482',
              'NOISEMAKER_FOR_CPU': cpu_git,
              'NOISEMAKER_SHADER_GIT': temporary / 'shader-fixtures-git',
              'NOISEMAKER_ORACLE_NODE': pathlib.Path(shutil.which('node')).resolve(),
