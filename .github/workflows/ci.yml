          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          values = {
              'NOISEMAKER_REGEN_CACHE': temporary / 'typed-regen-cache',
              'NOISEMAKER_CPU_ROOT': temporary / 'cpu-authority',
              'NOISEMAKER_CPU_AUTHORITY_LEDGER': temporary / 'cpu-authority.sha256',
