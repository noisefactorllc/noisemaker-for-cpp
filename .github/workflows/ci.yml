            noisemaker-render noisemaker-cpu-example-perlin noisemaker-dsl-frontend-oracle \
            noisemaker-dsl-parser-oracle noisemaker-dsl-compiler-oracle -j2

      # The unittest bridge and native pytest cases both require pytest.
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check pytest

      - name: Prepare authenticated typed regeneration cache
        run: python -c 'from tools.glslcpp import generate_typed_slice; generate_typed_slice.generate_outputs()'

      # A whole partition of this suite cannot finish within one child's
      # 300-second bound, so each partition starts as groups that can.
      - name: Run full discovery
        run: python tools/run_partitioned_checks.py python --groups 8 --python-suite portable

      - name: Run parametrized and fixture-based oracle cases
        run: python -m pytest -q tests/test_render_scatter_contracts.py tests/test_noise3d_dead_globals.py

      - name: Independently rederive every cached typed output
        run: python -m tools.glslcpp.regen_cache --verify

  corpus-parity:
    name: byte-exact corpus parity (C++ vs JS authority)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # The frozen CPU authority is the public JS reference at the revision
      # whose 98-file behavioral aggregate this repository pins. Checking it
      # out at that exact commit reproduces the authority bit-for-bit.
      - uses: actions/checkout@v4
        with:
          repository: noisefactorllc/noisemaker-for-cpu
          ref: db42f30c5c3ab711362bf5dbd4013b16637b48f5
          path: cpu-authority-checkout

      - name: Stage authority outside the repository tree
        run: |
          mv "$GITHUB_WORKSPACE/cpu-authority-checkout" "$RUNNER_TEMP/cpu-authority"
          rm -rf "$RUNNER_TEMP/cpu-authority/.git"

      # The JS runner refuses any authority without its ledger (fail-closed).
      # Here the content is already authenticated by checking out the pinned
      # commit, so a ledger generated from that checkout carries the same
      # trust. 895 entries, `sha256  abspath` — the runner verifies each.
      - name: Write the authority ledger
        run: |
          python3 - "$RUNNER_TEMP/cpu-authority" "$RUNNER_TEMP/cpu-authority-ledger.sha256" <<'PY'
          import hashlib, pathlib, sys
          root, out = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          lines = [f"{hashlib.sha256(f.read_bytes()).hexdigest()}  {f}"
                   for f in sorted(p for p in root.rglob("*") if p.is_file())]
          out.write_text("\n".join(lines) + "\n")
          print(f"ledger entries: {len(lines)}")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install zlib
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Build the C++ corpus driver
        id: build-driver
        run: |
          cmake -S . -B build-parity -DCMAKE_BUILD_TYPE=Release
          cmake --build build-parity --target noisemaker-dsl-cpu-case -j

      # Every authority-supported admitted record must execute byte-exactly.
      # C++ refusals fail this gate even if a fixture records their reasons.
      - name: Run the byte-exact corpus lane
        env:
          NOISEMAKER_CPU_ROOT: ${{ runner.temp }}/cpu-authority
          NOISEMAKER_CPU_AUTHORITY_LEDGER: ${{ runner.temp }}/cpu-authority-ledger.sha256
          NOISEMAKER_DSL_CPU_CASE: ${{ github.workspace }}/build-parity/noisemaker-dsl-cpu-case
        run: python3 -B -m unittest tests.test_dsl_corpus_parity tests.test_case_driver_dimensions tests.test_osc_automation_parity -v

      # The corpus lane renders each effect once, at 17x11, with default
      # parameters. That single point hid real divergences, so it is not the
      # parity proof by itself. The sweep renders every authority effect across
      # sizes (including 1x1 and non-square), seeds, times, randomized parameter
      # domains and chains, compares RGBA8 and the float32 surface behind it,
      # and fails on any divergence, any timeout, or any refusal of an effect
      # the export kit claims.
      - name: Parameter sweep parity gate
        if: ${{ !cancelled() && steps.build-driver.outcome == 'success' }}
        env:
          NOISEMAKER_CPU_ROOT: ${{ runner.temp }}/cpu-authority
          NOISEMAKER_CPU_AUTHORITY_LEDGER: ${{ runner.temp }}/cpu-authority-ledger.sha256
          NOISEMAKER_DSL_CPU_CASE: ${{ github.workspace }}/build-parity/noisemaker-dsl-cpu-case
        run: python3 -B tools/parity/sweep.py --out "$RUNNER_TEMP/sweep" --variants 6 --gate kit --workers 2 --max-seconds-per-case 3600 --timeout-retry-factor 0

      - name: Keep the sweep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-sweep
          path: |
            ${{ runner.temp }}/sweep/summary.md
            ${{ runner.temp }}/sweep/results.json
            ${{ runner.temp }}/sweep/results.jsonl
            ${{ runner.temp }}/sweep/run-manifest.json
          if-no-files-found: warn

  # The define-parameter enumeration has its own job and time budget. Its 4908
  # cases measured 647 minutes of serial render time on an Apple M2 (2026-10-18,
  # authority 5e93c23c): about 323 minutes on 2 workers, more than the corpus
  # job above can hold beside its other lanes. ubuntu-latest has 4 vCPUs, so
  # the gate uses 4 workers (about 162 minutes at that measured rate) and the
  # job keeps the 360-minute maximum as headroom. A failure of this job fails
  # the CI run, so the export kit (export-kit.yml) does not release.
  define-parity:
    name: define-parameter enumeration parity (C++ vs JS authority)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # The same frozen authority as the corpus-parity job.
      - uses: actions/checkout@v4
        with:
          repository: noisefactorllc/noisemaker-for-cpu
          ref: db42f30c5c3ab711362bf5dbd4013b16637b48f5
          path: cpu-authority-checkout

      - name: Stage authority outside the repository tree
        run: |
          mv "$GITHUB_WORKSPACE/cpu-authority-checkout" "$RUNNER_TEMP/cpu-authority"
          rm -rf "$RUNNER_TEMP/cpu-authority/.git"

      - name: Write the authority ledger
        run: |
          python3 - "$RUNNER_TEMP/cpu-authority" "$RUNNER_TEMP/cpu-authority-ledger.sha256" <<'PY'
          import hashlib, pathlib, sys
          root, out = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          lines = [f"{hashlib.sha256(f.read_bytes()).hexdigest()}  {f}"
                   for f in sorted(p for p in root.rglob("*") if p.is_file())]
          out.write_text("\n".join(lines) + "\n")
          print(f"ledger entries: {len(lines)}")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install zlib
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Build the C++ corpus driver
        run: |
          cmake -S . -B build-parity -DCMAKE_BUILD_TYPE=Release
          cmake --build build-parity --target noisemaker-dsl-cpu-case -j

      # Every compile-define parameter at each value in its domain, plus joint
      # samples. The gate also fails when a define parameter's isolated cases
      # never change the agreed output (define liveness).
      - name: Define-parameter enumeration parity gate
        env:
          NOISEMAKER_CPU_ROOT: ${{ runner.temp }}/cpu-authority
          NOISEMAKER_CPU_AUTHORITY_LEDGER: ${{ runner.temp }}/cpu-authority-ledger.sha256
          NOISEMAKER_DSL_CPU_CASE: ${{ github.workspace }}/build-parity/noisemaker-dsl-cpu-case
        run: python3 -B tools/parity/sweep.py --out "$RUNNER_TEMP/sweep-defines" --define-enum --gate kit --workers 4 --max-seconds-per-case 3600 --timeout-retry-factor 0

      - name: Keep the define sweep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-sweep-defines
          path: |
            ${{ runner.temp }}/sweep-defines/summary.md
            ${{ runner.temp }}/sweep-defines/results.json
            ${{ runner.temp }}/sweep-defines/results.jsonl
            ${{ runner.temp }}/sweep-defines/run-manifest.json
          if-no-files-found: warn

  package-consumer:
    name: install + external find_package consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zlib
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Build, install, and consume package
        shell: bash
        run: |
          set -euxo pipefail
          src="$GITHUB_WORKSPACE"
          build="$RUNNER_TEMP/noisemaker-for-cpp-build"
          prefix="$RUNNER_TEMP/noisemaker-for-cpp-prefix"
          consumer_build="$RUNNER_TEMP/noisemaker-for-cpp-consumer-build"
          cmake -S "$src" -B "$build" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build "$build" --target noisemaker-cpu --parallel
          cmake --install "$build"
          test -f "$prefix/lib/cmake/noisemaker-for-cpp/noisemaker-for-cppConfig.cmake"
          test -f "$prefix/include/noisemaker/generated/catalog.hpp"
          cmake -S "$src/tests/cmake_package_consumer" -B "$consumer_build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build "$consumer_build" --parallel
          "$consumer_build/noisemaker-package-consumer"
