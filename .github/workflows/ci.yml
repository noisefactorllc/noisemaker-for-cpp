          python - <<'PY'
          import hashlib, io, os, pathlib, shutil, subprocess, tarfile
          temporary = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          cpu_git = temporary / 'cpu-fixtures-git'
          sources = {
