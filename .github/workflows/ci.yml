          executables = {
              'NOISEMAKER_DSL_CPU_CASE': 'noisemaker-dsl-cpu-case',
              'NOISEMAKER_DSL_CPU_BENCHMARK': 'noisemaker-dsl-cpu-benchmark',
              'NOISEMAKER_RENDER_CLI': 'noisemaker-render',
              'NOISEMAKER_EXAMPLE_PERLIN': 'noisemaker-cpu-example-perlin',
              'NOISEMAKER_DSL_CPP_ORACLE': 'noisemaker-dsl-frontend-oracle',
              'NOISEMAKER_DSL_PARSER_ORACLE': 'noisemaker-dsl-parser-oracle',
              'NOISEMAKER_DSL_COMPILER_ORACLE': 'noisemaker-dsl-compiler-oracle',
          }
          values.update({key: workspace / 'build' / value for key, value in executables.items()})
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, value in values.items():
                  output.write(f'{key}={value}\n')
          PY

      - name: Build oracle executables
        run: |
          sudo apt-get update && sudo apt-get install -y zlib1g-dev
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target noisemaker-dsl-cpu-case noisemaker-dsl-cpu-benchmark \
            noisemaker-render noisemaker-cpu-example-perlin noisemaker-dsl-frontend-oracle \
            noisemaker-dsl-parser-oracle noisemaker-dsl-compiler-oracle -j2

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check pytest

      - name: Prepare authenticated typed regeneration cache
        run: python -c 'from tools.glslcpp import generate_typed_slice; generate_typed_slice.generate_outputs()'

      # tests/gate.py: every test marked `full_run_only` (the measured slow
      # ones -- typed-slice regenerations, historical milestone
      # reconstructions, compiled-probe kernels) skips here and runs in the
      # full suite below.
      - name: Run the push-gate subset
        env:
          NOISEMAKER_PUSH_GATE: '1'
        run: python tools/run_partitioned_checks.py python --groups 8 --python-suite portable

      - name: Independently rederive every cached typed output
        run: python -m tools.glslcpp.regen_cache --verify

  python-tests:
    name: python test suite
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The structural, mutation, and historical-reconstruction suite regenerates
    # the typed slice many times over; it is slow by design. It measures ~47
    # minutes on an M-series laptop and hosted runners are slower, so the budget
    # is deliberately well above the observed time rather than just above it --
    # this suite grows with every ported program, and a timeout here would look
    # like a test failure rather than a scheduling problem.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '26.0.0'

      - uses: actions/checkout@v4
        with:
          repository: noisefactorllc/noisemaker-for-cpu
          ref: db42f30c5c3ab711362bf5dbd4013b16637b48f5
          fetch-depth: 0
          path: cpu-fixtures-checkout
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
