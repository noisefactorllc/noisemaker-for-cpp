name: Authority drift

# CI proves parity against one pinned noisemaker-for-cpu commit. This workflow
# fails whenever noisemaker-for-cpu's default branch behaves differently from
# that pin, or when this port's export kit does not claim exactly the effects
# the authority renders, so a stale or partial port cannot stay green.

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/*.md'
      - 'docs/plans/**'
      - 'docs/hero.jpg'
      - 'docs/port-engineering/README.md'
      - 'docs/port-engineering/task-*review*.md'
      - 'docs/port-engineering/task-*review*.md.sha256'
      - 'docs/port-engineering/task-*brief.md'
      - 'docs/port-engineering/task-*brief.md.sha256'
      - 'docs/port-engineering/task-*design*.md'
      - 'docs/port-engineering/task-*design*.md.sha256'
      - 'docs/port-engineering/shape-mixer-parity/README.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - '.github/FUNDING.yml'
      - '.github/CODEOWNERS'
      - '.editorconfig'
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: noisefactorllc/noisemaker-for-cpu
          path: cpu-authority-live

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stage the live authority outside the repository tree
        run: mv "$GITHUB_WORKSPACE/cpu-authority-live" "$RUNNER_TEMP/cpu-authority-live"

      - name: Compare the pinned authority with the live authority
        run: python -B tools/dsl/check_authority_drift.py --cpu-root "$RUNNER_TEMP/cpu-authority-live"

      - name: Export kit claims exactly the effects the authority renders
        if: always()
        run: node export-kit/check-authority-coverage.mjs --cpu-root "$RUNNER_TEMP/cpu-authority-live"
