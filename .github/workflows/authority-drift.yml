name: Authority drift

# Check the live CPU authority on main and verify the reviewed parity
# authority on 2.x. Both checks require exact export kit effect coverage.

on:
  push:
    branches: [main, 2.x]
    paths-ignore:
      - '*.md'
      - 'docs/*.md'
      - 'docs/plans/**'
      - 'docs/hero.jpg'
      - 'docs/port-engineering/README.md'
      - 'docs/port-engineering/task-*review*.md'
      - 'docs/port-engineering/task-*review*.md.sha256'
      - 'docs/port-engineering/task-*brief.md'
      - 'docs/port-engineering/task-*brief.md.sha256'
      - 'docs/port-engineering/task-*design*.md'
      - 'docs/port-engineering/task-*design*.md.sha256'
      - 'docs/port-engineering/shape-mixer-parity/README.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - '.github/FUNDING.yml'
      - '.github/CODEOWNERS'
      - '.editorconfig'
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Read the pinned authority identities
        if: github.ref == 'refs/heads/2.x'
        id: pins
        run: python -B scripts/authority-pins github >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: noisefactorllc/noisemaker-for-cpu
          ref: ${{ steps.pins.outputs.cpu }}
          path: cpu-authority

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stage the CPU authority outside the repository tree
        run: mv "$GITHUB_WORKSPACE/cpu-authority" "$RUNNER_TEMP/cpu-authority"

      - name: Compare the lock with the live authority
        if: github.ref != 'refs/heads/2.x'
        run: python -B tools/dsl/check_authority_drift.py --cpu-root "$RUNNER_TEMP/cpu-authority"

      - name: Verify the pinned CPU checkout and behavioral lock
        if: github.ref == 'refs/heads/2.x'
        env:
          CPU_SHA: ${{ steps.pins.outputs.cpu }}
          CORPUS_SHA: ${{ steps.pins.outputs.shader }}
        run: python -B tools/dsl/check_authority_drift.py --cpu-root "$RUNNER_TEMP/cpu-authority" --pinned "$CPU_SHA" "$CORPUS_SHA"

      - name: Export kit claims exactly the effects the authority renders
        if: always()
        run: node export-kit/check-authority-coverage.mjs --cpu-root "$RUNNER_TEMP/cpu-authority"
