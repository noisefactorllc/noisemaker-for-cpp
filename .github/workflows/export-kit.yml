name: Export kit

# Public repo: holds NO deploy credentials. Dispatches the export-kit
# release workflow, which builds this repo's export kit at this exact
# SHA and ships it to kits.noisedeck.app.
#
# A kit is released only after a successful full CI run on main (the weekly
# schedule or a workflow_dispatch of CI), which adds the full Python suite and
# the byte-exact corpus parity to the push gate. Pushes run only the push
# gate, so they release nothing. A SHA that already carries a kit tag is not
# released again.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: export-kit-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Skip a SHA that is already released
        id: released
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          tags=$(git ls-remote --tags "https://github.com/$REPO.git" 'refs/tags/kit-*')
          if printf '%s\n' "$tags" | awk '$2 ~ /\^\{\}$/ { print $1 }' | grep -qx "$SHA"; then
            echo "$SHA already carries a kit tag; nothing to release."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the verified SHA
        if: steps.released.outputs.released == 'false'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Check compatibility list
        if: steps.released.outputs.released == 'false'
        run: node export-kit/generate-compat.mjs --check

      - name: Check the release dispatch configuration
        if: steps.released.outputs.released == 'false'
        env:
          RELEASE_REPOSITORY: ${{ secrets.RELEASE_REPOSITORY }}
          EXPORT_KIT_RELEASE_WORKFLOW: ${{ secrets.EXPORT_KIT_RELEASE_WORKFLOW }}
        run: |
          missing=""
          [ -n "$RELEASE_REPOSITORY" ] || missing="$missing RELEASE_REPOSITORY"
          [ -n "$EXPORT_KIT_RELEASE_WORKFLOW" ] || missing="$missing EXPORT_KIT_RELEASE_WORKFLOW"
          if [ -n "$missing" ]; then
            echo "::error::The release dispatch is not configured. Empty or unset secret(s):$missing"
            exit 1
          fi

      - name: Mint release-dispatch token
        if: steps.released.outputs.released == 'false'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liy6T6BW0BXuZRzx
          private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
          owner: noisefactorllc
          repositories: ${{ secrets.RELEASE_REPOSITORY }}

      - name: Dispatch the export-kit release
        if: steps.released.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_REPOSITORY: ${{ secrets.RELEASE_REPOSITORY }}
          EXPORT_KIT_RELEASE_WORKFLOW: ${{ secrets.EXPORT_KIT_RELEASE_WORKFLOW }}
        run: |
          gh workflow run "$EXPORT_KIT_RELEASE_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY_OWNER/$RELEASE_REPOSITORY" \
            --ref main \
            -f kit=cpp \
            -f sha="$SHA"
